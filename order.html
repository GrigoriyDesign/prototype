  /* ---------- верхние круглые кнопки ---------- */
  .topbtns{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 14px);
    right:14px;
    display:flex;flex-direction:column;gap:12px;z-index:15;
  }
  .round{
    width:62px;height:62px;border-radius:50%;background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.14);
    display:flex;align-items:center;justify-content:center;
    border:0;cursor:pointer;
  }
  .round:active{transform:scale(.96)}

  /* ---------- зум ---------- */
  .zoom{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 178px);
    right:14px;
    display:flex;flex-direction:column;gap:10px;z-index:15;
  }
  .zbtn{
    width:56px;height:56px;border-radius:14px;background:#fff;border:0;
    box-shadow:0 3px 12px rgba(0,0,0,.14);
    font-size:28px;line-height:1;font-weight:400;color:#111;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:-apple-system,sans-serif;
  }
  .zbtn:active{transform:scale(.96)}

  /* ---------- маркеры ---------- */
  .pin{
    position:fixed;left:50%;top:41%;transform:translate(-50%,-100%);
    z-index:10;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
  }
  .car{
    position:fixed;left:50%;top:58%;transform:translate(-50%,-100%) rotate(-8deg);
    z-index:9;filter:drop-shadow(0 3px 6px rgba(0,0,0,.30));
  }

  /* ---------- шторка ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    height:auto;
    max-height:92vh;max-height:92dvh;
    background:#fff;
    border-radius:26px 26px 0 0;
    box-shadow:0 -6px 26px rgba(0,0,0,.13);
    transform:translate3d(0,0,0);
    transition:transform .34s cubic-bezier(.32,.72,0,1);
    touch-action:none;
    display:flex;flex-direction:column;
  }
  .sheet.dragging{transition:none}
  .sheet.collapsed{height:auto}

  .handle-zone{
    padding:12px 0 6px;display:flex;justify-content:center;
    flex:0 0 auto;cursor:grab;
  }
  .handle{width:46px;height:5px;border-radius:3px;background:#111;opacity:.85}

  .sheet-body{
    flex:1 1 auto;overflow:hidden;
    display:flex;flex-direction:column;
    padding:0 var(--pad) calc(env(safe-area-inset-bottom,0px) + 18px);
  }

  .head{text-align:center;padding:14px 0 0}
  .head h1{
    margin:0;font-size:27px;line-height:32px;font-weight:800;
    letter-spacing:-.4px;color:var(--ink);
  }
  .head p{margin:7px 0 0;font-size:14px;line-height:18px;color:var(--muted)}

  /* ---------- таймер ---------- */
  .timer{
    margin:18px 0 0;height:6px;border-radius:3px;background:#e8e8ec;
    overflow:hidden;position:relative;
  }
  .timer-fill{
    position:absolute;left:0;top:0;bottom:0;
    width:100%;border-radius:3px;
    background:var(--green);
    transition:background-color .5s ease, width .1s linear;
  }

  /* ---------- карточки ---------- */
  .cards{display:flex;gap:12px;margin:18px 0 0}
  .card{
    flex:1;background:#f4f4f6;border-radius:14px;
    padding:13px 14px 14px;
  }
  .card .label{font-size:14px;line-height:17px;color:#8e8e93}
  .card .value{font-size:21px;line-height:25px;font-weight:700;margin-top:5px;color:var(--ink)}
  .card .value.pos{color:#16a34a}

  /* ---------- маршрут ---------- */
  .route{margin:20px 0 0}
  .stop{display:flex;align-items:flex-start;gap:12px;position:relative}
  .stop + .stop{margin-top:19px}
  .stop .dot{
    flex:0 0 auto;width:12px;height:12px;border-radius:50%;
    background:var(--blue);margin-top:3px;position:relative;z-index:2;
  }
  .stop .dot.hollow{
    background:#fff;border:3px solid var(--blue);width:13px;height:13px;
  }
  .stop .addr{font-size:15px;line-height:20px;color:#1c1c1e}
  /* соединительная линия */
  .stop.bridge::after{
    content:"";position:absolute;left:5px;top:15px;
    width:2px;height:calc(100% + 6px);background:var(--blue);z-index:1;
  }

  /* ---------- кнопки ---------- */
  .actions{
    margin-top:auto;padding-top:22px;
    display:flex;flex-direction:column;gap:10px;
  }
  .btn-primary{
    width:100%;height:56px;border:0;border-radius:12px;
    background:var(--blue);color:#fff;
    font-family:inherit;font-size:17px;font-weight:600;
    cursor:pointer;
  }
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{
    width:100%;height:56px;border-radius:12px;
    background:#fff;border:1.5px solid var(--blue);
    font-family:inherit;font-size:17px;font-weight:500;color:#1c1c1e;
    cursor:pointer;line-height:1.15;
  }
  .btn-ghost small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
  .btn-ghost:active{transform:scale(.985)}

  /* ---------- шторка в свёрнутом виде: прячем всё ниже таймера ---------- */
  .sheet.collapsed .cards,
  .sheet.collapsed .route,
  .sheet.collapsed .actions{opacity:0;pointer-events:none;transition:opacity .18s ease}
  .cards,.route,.actions{opacity:1;transition:opacity .26s ease .06s}

  /* ---------- тост ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translate(-50%,20px);
    background:rgba(28,28,30,.94);color:#fff;
    padding:13px 22px;border-radius:14px;
    font-size:15px;font-weight:500;
    opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;
    z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){
    .sheet,.map,.timer-fill,.toast{transition-duration:.01s !important}
  }
</style>
</head>
<body>

<div class="map" id="map"></div>

<!-- маркеры -->
<svg class="pin" width="42" height="52" viewBox="0 0 42 52" fill="none">
  <path d="M21 0C9.4 0 0 9.4 0 21c0 15.7 21 31 21 31s21-15.3 21-31C42 9.4 32.6 0 21 0z" fill="#0a6cff"/>
  <circle cx="21" cy="21" r="8" fill="#fff"/>
</svg>

<svg class="car" width="46" height="34" viewBox="0 0 46 34" fill="none">
  <rect x="4" y="8" width="38" height="18" rx="7" fill="#FFC61A" stroke="#1c1c1e" stroke-width="1.2"/>
  <rect x="10" y="3" width="26" height="9" rx="4" fill="#FFC61A" stroke="#1c1c1e" stroke-width="1.2"/>
  <rect x="13" y="6" width="8" height="5" rx="1.6" fill="#2b3138"/>
  <rect x="25" y="6" width="8" height="5" rx="1.6" fill="#2b3138"/>
  <circle cx="13" cy="27" r="4" fill="#2b3138"/>
  <circle cx="33" cy="27" r="4" fill="#2b3138"/>
</svg>

<!-- верхние кнопки -->
<div class="topbtns">
  <button class="round" type="button" aria-label="Профиль">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="8" r="3.6"/>
      <path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>
      <path d="M3.2 20.8h17.6"/>
    </svg>
  </button>
  <button class="round" type="button" aria-label="Обновить">
    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round">
      <path d="M12 3a9 9 0 1 1-8.5 6"/>
      <path d="M3.2 3.4 6.4 9l4.8-1.5"/>
    </svg>
  </button>
</div>

<!-- зум -->
<div class="zoom">
  <button class="zbtn" id="zin" type="button" aria-label="Приблизить">+</button>
  <button class="zbtn" id="zout" type="button" aria-label="Отдалить">−</button>
</div>

<!-- шторка -->
<div class="sheet" id="sheet">
  <div class="handle-zone" id="handleZone"><div class="handle"></div></div>

  <div class="sheet-body">
    <div class="head">
      <h1>2 КМ - 5 МИН</h1>
      <p>Близкая подача</p>
    </div>

    <div class="timer"><div class="timer-fill" id="timerFill"></div></div>

    <div class="cards">
      <div class="card">
        <div class="label">Активность:</div>
        <div class="value pos">+1</div>
      </div>
      <div class="card">
        <div class="label">Цена:</div>
        <div class="value">290 ₽</div>
      </div>
    </div>

    <div class="route">
      <div class="stop bridge">
        <span class="dot"></span>
        <span class="addr">ул. Резенькова, д. 18</span>
      </div>
      <div class="stop">
        <span class="dot hollow"></span>
        <span class="addr">мкр. Дзержинского, д. 41</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="accept" type="button">Принять</button>
      <button class="btn-ghost" id="skip" type="button">
        Пропустить
        <small>Активность -1</small>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= ШТОРКА ================= */
  var sheet = document.getElementById('sheet');
  var handleZone = document.getElementById('handleZone');
  var mapEl = document.getElementById('map');

  var y = 0;            /* текущий сдвиг вниз, 0 = развёрнуто */
  var maxY = 0;         /* максимальный сдвиг = свёрнутое положение */
  var dragging = false;
  var startY = 0, startOffset = 0, lastY = 0, lastT = 0, velocity = 0;
  var collapsed = false;

  function safeBottom(){
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:1px;visibility:hidden';
    document.body.appendChild(probe);
    var v = probe.getBoundingClientRect().height;
    document.body.removeChild(probe);
    return v || 0;
  }

  function computeMax(){
    var h = sheet.getBoundingClientRect().height;
    var peek = 152 + safeBottom();     /* сколько шторки остаётся видно свёрнутой */
    maxY = Math.max(0, h - peek);
  }

  function setY(v, animate){
    y = Math.max(0, Math.min(maxY, v));
    if (animate === false) sheet.classList.add('dragging');
    else sheet.classList.remove('dragging');
    sheet.style.transform = 'translate3d(0,' + y + 'px,0)';
    sheet.classList.toggle('collapsed', y > maxY * 0.55);
    /* лёгкий сдвиг карты — эффект параллакса */
    mapEl.style.transform = 'scale(' + (zoomScale + 0.06 * (1 - y / (maxY || 1))) + ') ' +
                            'translateY(' + (-14 * (1 - y / (maxY || 1))) + 'px)';
  }

  function snap(){
    var target = (y > maxY * 0.38 || velocity > 0.55) ? maxY : 0;
    if (velocity < -0.55) target = 0;
    collapsed = target === maxY;
    setY(target, true);
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch(e){} }
  }

  var moved = false;          /* был ли реальный сдвиг, а не тап */

  function onDown(e){
    if (e.target.closest('button')) return;
    dragging = true;
    moved = false;
    var p = e.touches ? e.touches[0] : e;
    startY = p.clientY; lastY = startY; lastT = Date.now();
    startOffset = y; velocity = 0;
    sheet.classList.add('dragging');
  }

  function onMove(e){
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dy = p.clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    var now = Date.now();
    if (now - lastT > 0){
      velocity = (p.clientY - lastY) / (now - lastT);
    }
    lastY = p.clientY; lastT = now;
    setY(startOffset + dy, false);
    if (e.cancelable) e.preventDefault();
  }

  function onUp(){
    if (!dragging) return;
    dragging = false;
    snap();
  }

  sheet.addEventListener('touchstart', onDown, {passive:true});
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('touchend', onUp);
  document.addEventListener('touchcancel', onUp);

  /* мышь — для проверки на компьютере */
  sheet.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  /* тап по ручке — переключение */
  handleZone.addEventListener('click', function(e){
    if (e.target.closest('button')) return;
    if (moved) { moved = false; return; }   /* это был свайп, не тап */
    collapsed = !collapsed;
    setY(collapsed ? maxY : 0, true);
  });

  /* ================= ЗУМ ================= */
  var zoomScale = 1;
  var zoomLevel = 1;

  function applyZoom(){
    zoomScale = zoomLevel;
    mapEl.style.transform = 'scale(' + zoomScale + ')';
  }
  document.getElementById('zin').addEventListener('click', function(){
    zoomLevel = Math.min(2.2, zoomLevel + 0.28); applyZoom();
  });
  document.getElementById('zout').addEventListener('click', function(){
    zoomLevel = Math.max(0.82, zoomLevel - 0.28); applyZoom();
  });

  /* ================= ТАЙМЕР 5 МИНУТ ================= */
  var DURATION = 5 * 60 * 1000;      /* 5 минут */
  var startedAt = Date.now();
  var fill = document.getElementById('timerFill');
  var finished = false;

  function tick(){
    var left = DURATION - (Date.now() - startedAt);
    if (left < 0) left = 0;

    var ratio = left / DURATION;
    fill.style.width = (ratio * 100) + '%';

    /* зелёный -> оранжевый -> красный */
    var color;
    if (ratio > 0.5)       color = '#22c55e';   /* зелёный */
    else if (ratio > 0.2)  color = '#f5a524';   /* оранжевый */
    else                   color = '#ef4444';   /* красный */
    fill.style.backgroundColor = color;

    if (left === 0 && !finished){
      finished = true;
      fill.style.width = '0%';
      showToast('Время истекло');
    }
  }

  /* ================= КНОПКИ ================= */
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1900);
  }

  document.getElementById('accept').addEventListener('click', function(){
    showToast('Заказ принят');
  });
  document.getElementById('skip').addEventListener('click', function(){
    showToast('Заказ пропущен');
  });

  /* ================= СТАРТ ================= */
  function init(){
    computeMax();
    setY(0, true);
    tick();
    setInterval(tick, 120);
  }

  window.addEventListener('resize', function(){
    var wasCollapsed = collapsed;
    computeMax();
    setY(wasCollapsed ? maxY : 0, true);
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ computeMax(); setY(collapsed ? maxY : 0, true); }, 260);
  });

  /* запрет прокрутки страницы */
  window.addEventListener('scroll', function(){
    if (window.pageYOffset !== 0) window.scrollTo(0, 0);
  }, {passive:true});

  init();
})();
</script>
</body>
</html>
