<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0057FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Вход по номеру — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:#EDEDF0; overscroll-behavior:none;
    font-family:"Montserrat", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }

  /* Экран телефона: iPhone 12 = 390 x 844 */
  .app { position:fixed; inset:0; background:#fff; overflow:hidden; }
  @media (min-width:600px) and (min-height:760px) {
    body { display:flex; align-items:center; justify-content:center; }
    .app { position:relative; width:390px; height:844px; border-radius:44px;
           box-shadow:0 30px 80px rgba(0,0,0,.25); border:10px solid #111; }
  }

  .screen { position:absolute; inset:0; }

  /* ===== Экран 1: сплэш #0057FF, 2 секунды ===== */
  .splash { background:#0057FF; display:flex; align-items:center; justify-content:center;
            transition:opacity .35s ease; }
  .splash.hide { opacity:0; }
  .logo { width:92px; height:92px; border-radius:22px; display:block; }

  /* ===== Экран 2: ввод номера ===== */
  .phone { background:#fff; display:none; }
  .phone.active { display:block; }

  .title {
    position:absolute; left:27px; right:27px; top:84px;
    font-size:26px; line-height:32px; font-weight:700; color:#000; letter-spacing:-.2px;
  }

  /* Поле ввода — по макету: top 268, высота 56 */
  .field {
    position:absolute; left:27px; right:27px; top:268px; height:56px;
    display:flex; align-items:center; padding:0 16px;
    background:#fff; border:1px solid #C8C8CE; border-radius:8px;
    transition:border-color .15s ease, box-shadow .15s ease; cursor:text;
  }
  .field.active { border-color:#0057FF; box-shadow:0 0 0 1px #0057FF; }
  .field.error  { border-color:#E0463C; box-shadow:0 0 0 1px #E0463C; }

  .prefix { font-size:17px; font-weight:500; color:#000; margin-right:8px; flex:none; user-select:none; -webkit-user-select:none; }
  #numInput {
    flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent;
    font-family:inherit; font-size:17px; font-weight:500; color:#000; padding:0;
    letter-spacing:.3px; caret-color:#0057FF; appearance:none; -webkit-appearance:none;
  }
  #numInput::placeholder { color:#8E8E93; font-weight:400; }

  /* Подпись / ошибка — под полем */
  .msg {
    position:absolute; left:27px; right:27px; top:334px; min-height:36px;
    font-size:13px; line-height:18px; color:#000;
  }
  .msg .policy a { color:#0057FF; text-decoration:none; }
  .msg .err { display:none; }
  .msg .err b { color:#E0463C; font-weight:500; }
  .msg.error .policy { display:none; }
  .msg.error .err { display:block; }

  /* Кнопка — по макету: top 464, высота 55 */
  .btn {
    position:absolute; left:27px; right:27px; top:464px; height:55px;
    border:0; border-radius:8px; background:#D6D6DB; color:#fff;
    font-family:inherit; font-size:17px; font-weight:600; letter-spacing:.2px;
    transition:background-color .2s ease, transform .1s ease; cursor:default;
  }
  .btn.on { background:#0057FF; cursor:pointer; }
  .btn.on:active { transform:scale(.98); }

  .toast {
    position:absolute; left:50%; top:560px; transform:translate(-50%,6px);
    background:rgba(17,17,19,.92); color:#fff; font-size:14px; font-weight:500;
    padding:11px 16px; border-radius:12px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>

(function () {
  var splash      = document.getElementById('screenSplash');
  var phoneScreen = document.getElementById('screenPhone');
  var field       = document.getElementById('fieldBox');
  var input       = document.getElementById('numInput');
  var msg         = document.getElementById('msg');
  var btn         = document.getElementById('nextBtn');
  var toastEl     = document.getElementById('toast');

  var MAX = 10;
  var digits = '';

  /* 1. Сплэш 2 секунды, затем показываем экран номера */
  setTimeout(function () {
    splash.classList.add('hide');
    setTimeout(function () {
      splash.style.display = 'none';
      phoneScreen.classList.add('active');
    }, 350);
  }, 2000);

  /* 2. Формат: 900 123-45-67 */
  function format(d) {
    if (d.length <= 3) return d;
    if (d.length <= 6) return d.slice(0, 3) + ' ' + d.slice(3);
    if (d.length <= 8) return d.slice(0, 3) + ' ' + d.slice(3, 6) + '-' + d.slice(6);
    return d.slice(0, 3) + ' ' + d.slice(3, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8);
  }

  function render() {
    input.value = format(digits);
    var n = digits.length;

    var isError = (n === 1);   // одна цифра → ошибка
    var isValid = (n === MAX); // все 10 цифр → кнопка активна
    var hasText = (n >= 2);    // цифры введены → синий инпут

    field.classList.toggle('error', isError);
    field.classList.toggle('active', !isError && (hasText || document.activeElement === input));
    msg.classList.toggle('error', isError);

    btn.classList.toggle('on', isValid);
    btn.disabled = !isValid;
  }

  /* 3. Ввод: принимаем любые цифры */
  input.addEventListener('input', function () {
    var raw = input.value.replace(/\D/g, '');
    if (raw.length < digits.length) {
      // стёрли символ: берём то, что осталось цифрами
      digits = raw.slice(0, MAX);
    } else {
      digits = (digits + raw.slice(digits.length)).slice(0, MAX);
    }
    render();
  });

  // Если пользователь вставил текст с цифрами, всё равно обработаем
  input.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text');
    digits = (digits + text.replace(/\D/g, '')).slice(0, MAX);
    render();
  });

  input.addEventListener('focus', function () { render(); });
  input.addEventListener('blur',  function () { render(); });
  field.addEventListener('click', function () { input.focus(); });

  /* 4. Кнопка */
  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    toast('Демо: дальше экран с кодом из SMS');
  });

  function toast(t) {
    toastEl.textContent = t;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  render();
})();
</script>
</body>
</html>
